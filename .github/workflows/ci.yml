name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v6

      - name: Installer Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Construire et tester
        run: ./mvnw -B verify

      - name: Lancer l'application
        run: java -jar target/facture-1.0-SNAPSHOT-jar-with-dependencies.jar
        env:
          APP_ENV: test
          COMPTA_CLE: ${{ secrets.COMPTA_CLE }}

      - name: Publier le JAR
        uses: actions/upload-artifact@v7
        with:
          name: facture-jar
          path: target/facture-1.0-SNAPSHOT-jar-with-dependencies.jar

      - name: Publier le rapport de couverture
        uses: actions/upload-artifact@v7
        with:
          name: rapport-couverture
          path: target/site/jacoco/

  publier:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/dvopps/facture
      VERSION: ${{ github.run_number }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v6

      - name: Récupérer le JAR testé
        uses: actions/download-artifact@v8
        with:
          name: facture-jar
          path: target

      - name: Se connecter au registre
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" |
            docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Construire l'image
        run: docker build --build-arg VERSION=$VERSION -t $IMAGE:$VERSION .

      - name: Publier l'image
        run: docker push $IMAGE:$VERSION
