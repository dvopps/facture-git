name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v6

      - name: Installer Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Construire et tester
        run: ./mvnw -B verify

      - name: Lancer l'application
        run: java -jar target/facture-1.0-SNAPSHOT-jar-with-dependencies.jar
        env:
          APP_ENV: test
          COMPTA_CLE: ${{ secrets.COMPTA_CLE }}
